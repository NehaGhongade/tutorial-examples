<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script>
      (function(s, t, a, n) {
        s[t] || (s[t] = a, n = s[a] = function() {
          n.q.push(arguments)
        }, n.q = [], n.v = 2, n.l = 1 * new Date())
      })(window, "InstanaEumObject", "ineum");

      ineum('reportingUrl', 'https://eum-magenta-saas.instana.rocks');
      ineum('key', 'BcbUASokT2GnUJZvGMqiWA');
      ineum('trackSessions');
      ineum('autoPageDetection', true);
      ineum('enableW3CHeaders', true);

      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        if (form) {
          form.addEventListener('submit', async function (e) {
            e.preventDefault(); // Prevent default form submission

            const formData = new FormData(form);


              const username = formData.get('username');
              ineum('user', username); // set Instana user
              ineum('reportEvent', 'eventName', {
               });
            try {
              const response = await fetch('login', {
                method: 'POST',
                body: formData
              });

              const data = await response.json();


              if (data.status === 'success') {
                messageDiv.textContent = 'Login Successful!';
                messageDiv.style.color = 'green';

                ineum('reportEvent', 'LoginSuccess', {
                   meta: {
    'state': 'LoginSuccess'
  },
                });
              } else {
                messageDiv.textContent = 'Login Failed. Please try again.';
                messageDiv.style.color = 'red';

                ineum('reportEvent', 'LoginFailure', {
                  meta: {
    'state': 'LoginFailure'
  },
                });

              }

            } catch (err) {
              console.error('Login request failed:', err);
              messageDiv.textContent = 'An error occurred. Please try again later.';
              messageDiv.style.color = 'red';
            }
          });
        }
      });
    </script>
    <script defer crossorigin="anonymous" src="https://eum-magenta-saas.instana.rocks/1.7.5/eum.min.js"></script>
</head>
<body>
<form id="loginForm">
    <label>Username: <input id="username" name="username" required /></label><br/>
    <label>Password: <input name="password" type="password" required /></label><br/>
    <button type="submit">Login</button>
</form>

<div id="message" style="margin-top: 10px; font-weight: bold;"></div>
</body>
</html>
